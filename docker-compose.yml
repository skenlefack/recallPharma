# Environnement de développement local : base PostgreSQL 17 avec pgvector (pg_trgm, unaccent, btree_gist inclus)
# et Keycloak (royaume « recallpharma » importé au démarrage, comptes fictifs du jeu A10).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: recallpharma
      POSTGRES_USER: recallpharma
      POSTGRES_PASSWORD: recallpharma
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallpharma -d recallpharma"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8280
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8280:8080"
    volumes:
      - ./keycloak/realm-recallpharma.json:/opt/keycloak/data/import/realm-recallpharma.json:ro
      # Comptes créés depuis l'administration conservés entre deux redémarrages (le royaume n'est importé qu'une fois).
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Modèle open source local pour le Copilot (profil « ia ») : même interface OpenAI que vLLM en production.
  # docker compose --profile ia up -d ollama && docker compose exec ollama ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ia"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Application conteneurisée (profil « app ») : docker compose --profile ia --profile app up -d --build
  # Web http://localhost:3100 (comptes fictifs du royaume), API http://localhost:8100/docs, passerelle :8101.
  init:
    build: ./backend
    profiles: ["app"]
    command: ["recallpharma-init"]
    environment: &backend-env
      RECALLPHARMA_DATABASE_URL: postgresql+psycopg://recallpharma:recallpharma@db:5432/recallpharma
      RECALLPHARMA_REFERENCE_DATE: "2027-09-07"  # date du jeu A10
      RECALLPHARMA_OIDC_ISSUER: http://localhost:8280/realms/recallpharma  # émetteur vu du navigateur
      RECALLPHARMA_OIDC_JWKS_URL: http://keycloak:8080/realms/recallpharma/protocol/openid-connect/certs
      RECALLPHARMA_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      RECALLPHARMA_GATEWAY_URL: http://gateway:8001
      RECALLPHARMA_API_URL: http://api:8000
      RECALLPHARMA_LLM_BASE_URL: http://ollama:11434/v1
      RECALLPHARMA_EMBED_BASE_URL: http://ollama:11434/v1
      RECALLPHARMA_LLM_TIMEOUT_S: "900"  # modèle 7B sur processeur
      RECALLPHARMA_STORAGE_DIR: /app/var/documents
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    profiles: ["app"]
    environment: *backend-env
    ports:
      - "8100:8000"
    volumes:
      - documents:/app/var/documents
    depends_on:
      init: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}

  gateway:
    build: ./backend
    profiles: ["app"]
    command: ["uvicorn", "recallpharma.gateway.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: *backend-env
    ports:
      - "8101:8001"

  web:
    build: ./web
    profiles: ["app"]
    environment:
      RECALLPHARMA_API_URL: http://api:8000
      RECALLPHARMA_OIDC_ISSUER: http://localhost:8280/realms/recallpharma
      RECALLPHARMA_OIDC_BACKCHANNEL_URL: http://keycloak:8080/realms/recallpharma
      RECALLPHARMA_PUBLIC_URL: http://localhost:3100
    ports:
      - "3100:3000"  # adresse de retour déclarée dans le royaume
    depends_on:
      - api

volumes:
  pgdata:
  ollama:
  documents:
  keycloak-data:
