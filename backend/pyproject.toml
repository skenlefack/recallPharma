[project]
name = "recallpharma"
version = "0.1.0"
description = "RecallPharma — référentiel du médicament vétérinaire (API et moteur de règles)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "tzdata>=2024.2",
    "python-multipart>=0.0.12",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recallpharma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests qui exigent un serveur PostgreSQL (RECALLPHARMA_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textes français : apostrophes et espaces typographiques voulus

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/recallpharma/gateway/prompts.py" = ["E501"]  # invites : lignes de texte, non coupées

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["recallpharma"]
mypy_path = "src"

[tool.importlinter]
root_package = "recallpharma"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Le domaine ne dépend d'aucun cadre (règles pures, D4)"
type = "forbidden"
source_modules = ["recallpharma.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "recallpharma.api", "recallpharma.db"]

[[tool.importlinter.contracts]]
name = "La passerelle d'IA n'a aucun accès à la base ni au code de l'API : outils par HTTP seulement (ADR-07, ADR-08)"
type = "forbidden"
source_modules = ["recallpharma.gateway"]
forbidden_modules = ["sqlalchemy", "psycopg", "recallpharma.db", "recallpharma.api", "recallpharma.curation"]

[[tool.importlinter.contracts]]
name = "L'API ne parle jamais au modèle : elle passe par la passerelle (ADR-07)"
type = "forbidden"
source_modules = ["recallpharma.api", "recallpharma.curation", "recallpharma.db"]
forbidden_modules = ["recallpharma.gateway"]
